[project]
name = "inference-under-limits"
version = "0.1.0"
description = "Rate-limited inference gateway, provider simulator and load generator"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",  # FastAPI's TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "simulator", "loadgen", "verify", "scenarios"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
